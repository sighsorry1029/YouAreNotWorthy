# Custom personal keys awarded within 32m of a configured creature's death.
# Vanilla/modded defeat global keys are personalized automatically and normally do
# not need a duplicate defeatKeys rule.
defeatKeys:
  - prefabs: [Serpent]
    key: defeat_serpent

# Item tiers are ordered from lowest to highest. A sequence is an unrestricted
# resource tier. A mapping adds a required personal key to every listed resource
# and to items that inherit the tier through a production recipe.
# Tier names such as Meadows, Ocean, or SerpentItems are arbitrary labels. They
# never check the player's current biome and have no special OfferingBowl meaning;
# OfferingBowl restrictions check the offered item's resolved tier instead. An
# offering is blocked only when its item is listed in a tier's resources or
# inherits that tier through a production path. The altar's biome or a tier label
# alone never blocks an offering.
# Key-required Vanilla doors likewise check the physical key item's resolved tier.
# The player must possess both that item and its tier's required personal key;
# ordinary doors without a key item are unaffected.
Meadows:
  - Wood
  - Stone
  - Resin
  - Dandelion
  - Flint
  - LeatherScraps
  - BoneFragments
  - Honey
  - Raspberry
  - Blueberries
  - DeerHide
  - DeerMeat
  - Feathers
  - GreydwarfEye
  - RawMeat
